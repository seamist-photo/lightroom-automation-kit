name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (the version Lightroom runs)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -v

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core tests, no third-party dependencies
        run: python -m unittest discover -v

      - name: Full tests (numpy, pillow, lupa)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow lupa
          python -m unittest discover -v

      - name: CLI smoke run
        run: |
          python -m lrc_kit.cli --version
          python -m lrc_kit.cli preflight syntax examples/minimal-bridge/*.lua
