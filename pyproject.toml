[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrc-toolkit"
version = "0.1.0"
description = "Toolkit for automating Adobe Lightroom Classic: read the catalog, preflight Lua plugins offline, verify color numerically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "seamist-photo and contributors" }]
keywords = ["lightroom", "lightroom-classic", "automation", "catalog", "lua", "color"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
color = ["numpy>=1.23", "pillow>=9"]
ssim = ["scikit-image>=0.20"]
preflight = ["lupa>=2.0"]
dev = ["pytest>=7", "numpy>=1.23", "pillow>=9"]

[project.scripts]
lrc-kit = "lrc_kit.cli:main"

[project.urls]
Homepage = "https://github.com/seamist-photo/lightroom-automation-kit"

[tool.setuptools.packages.find]
include = ["lrc_kit*"]
